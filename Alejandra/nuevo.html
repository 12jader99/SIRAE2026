<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistencia</title>
    <link rel="stylesheet" href="asistencia.css">
</head>
<body>

    <div class="fondo">

        <div class="card">

            <!-- CABECERA -->
            <div class="header">
                <div>
                    <a href="#" class="volver">← Volver al inicio</a>
                    <p class="subtitulo">Asistencia diaria</p>
                    <p class="texto">Registra cuántos estudiantes asistieron hoy</p>
                </div>
                <div class="menu">⋮</div>
            </div>

            <!-- ESTUDIANTES ESPERADOS -->
            <div class="esperados">
                👥 <span>Estudiantes esperados: <strong>250</strong></span>
            </div>

            <!-- FORMULARIO -->
            <div class="asistencia-box">

                <div class="col">
                    <p>¿Cuántos estudiantes asistieron de primaria?</p>
                    <small>18 - 06 - 2026</small>
                    <input type="text">
                    <button>Guardar asistencia</button>
                </div>

                <div class="col">
                    <p>¿Cuántos estudiantes asistieron de 10° y 11°?</p>
                    <small>18 - 06 - 2026</small>
                    <input type="text">
                    <button>Guardar asistencia</button>
                </div>

                <div class="col">
                    <p>Total de estudiantes</p>
                    <small>18 - 06 - 2026</small>
                    <input type="text">
                    <button>Guardar asistencia</button>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
