<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="Usuarios.css">
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <input type="text" placeholder="Search">
        <div class="menu-icon">☰</div>
    </div>

    <!-- Tabla -->
    <div class="table">
        <div class="table-header">
            <span>Imagen</span>
            <span>Nombre</span>
            <span>Apellidos</span>
            <span>Rol</span>
            <span>Estado</span>
            <span>Opciones</span>
        </div>

        <!-- FILA 1 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>
            <div>Andres</div>
            <div>Espinoza</div>
            <div>⌄</div>
            <div class="switch green"></div>
            <div class="icons">
                <a href="../isa/infoAndres.html">👁</a>
                <a href="../jader12/FrameC.html">✏️</a>
                <button onclick="eliminarUsuario(event, 'Andres')">🗑️</button>
            </div>
                 
        </div>

        <!-- FILA 2 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>
            <div>Yeimy</div>
            <div>Pipicano</div>
            <div>⌄</div>
            <div class="switch green"></div>
           <div class="icons">
                <a href="../jader12/infoYeimy.html">👁</a>
                <a href="../jader12/FrameC.html">✏️</a>
                <button onclick="eliminarUsuario(event, 'Yeimy')">🗑️</button>

            </div> 
        </div>

        <!-- FILA 3 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>
            <div>Jader</div>
            <div>Ortega</div>
            <div>⌄</div>
            <div class="switch red"></div>
            <div class="icons">
                <a href="../isa/infoJader.html">👁</a>
                <a href="../jader12/FrameC.html">✏️</a>
                <button onclick="eliminarUsuario(event, 'Jader')">🗑️</button>
            </div>
        </div>

        <!-- FILA 4 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>
            <div>Jhon.f</div>
            <div>Rivera</div>
            <div>⌄</div>
            <div class="switch red"></div>
            <div class="icons">
                <a href="../jader12/infofredy.html">👁</a>
                <a href="../jader12/FrameC.html">✏️</a>
                <button onclick="eliminarUsuario(event, 'Jhon.f')">🗑️</button>
            </div>
        </div>

        <!-- FILA 5 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>
            <div>Isabela</div>
            <div>Campo</div>
            <div>⌄</div>
            <div class="switch green"></div>
            <div class="icons">
                <a href="../isa/infoIsa.html">👁</a>
                <a href="../jader12/FrameC.html">✏️</a>
                <button onclick="eliminarUsuario(event, 'Isabela')">🗑️</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="../isa/home.html" class="back">←</a>
        <button class="add">＋ Agregar usuarios</button>
    </div>

</div>

<script>
function eliminarUsuario(e, nombre) {
    let confirmacion = confirm("¿Seguro que quieres eliminar a " + nombre + "?");

    if (confirmacion) {
        alert("Usuario eliminado correctamente");

        // Elimina la fila visualmente
        e.target.closest('.row').remove();
    } else {
        alert("Operación cancelada");
    }
}
</script>
</body>
</html>
