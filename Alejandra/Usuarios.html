<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="Usuarios.css">
</head>
<body>

            <div class="icons"> <img src="foto.png" class="icono">👁</div>           
        </div>

        <!-- FILA 2 -->

            <div class="avatar"><span>👤</span></div>
            <div>Yeimy</div>

            <div class="switch green"></div>

        <!-- FILA 3 -->

        </div>

        <!-- FILA 4 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>

        </div>

        <!-- FILA 5 -->
        <div class="row">
            <div class="avatar"><span>👤</span></div>
            <div>Isabela</div>
            <div>Campo</div>
            <div>⌄</div>
            <div class="switch green"></div>
            <div class="icons"><img src="foto.png" class="icono">👁</div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="back">←</div>

</div>

</html>
