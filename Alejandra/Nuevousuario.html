<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="Nuevousuario.css">
</head>
<body>


   
<form>


    <div class="contenedor">

        <h2>Estas creando un nuevo usuario</h2>

        <div class="formulario">

            <div class="fila">
                <input type="text" placeholder="Primer nombre" required>
                <input type="text" placeholder="Segundo nombre" required>
                <input type="text" placeholder="Primer apellido" required>
            </div>

            <div class="fila">
                <input type="text" placeholder="Segundo apellido" required>
                <input type="number" placeholder="Cédula" required>
                <input type="number" placeholder="Edad" required>
            </div>

            <div class="fila">
                <input type="text" placeholder="Género" required>
                <input type="text" placeholder="Tipo de sangre" required>
                <input type="number" placeholder="Teléfono" required>
            </div>

            <div class="fila">
                <input type="text" placeholder="Dirección" required>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="text" placeholder="Rol" required> 
            </div>
 
        </div>   
        <div class="botones">
            <form>
            <button class="guardar" type="submit">GUARDAR</button>
            <button class="cancelar">CANCELAR</button>
            </form>
        </div>

    </div>
</form>

</body>
</html>
