<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="nvusuario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>

    <div class="movil-container">
        <header class="header">
            <i class="fas fa-arrow-left"></i>
            <h1>Dann Martinez</h1>
            <div class="check-btn">
                <i class="fas fa-check"></i>
            </div>
        </header>

        <div class="foto-perfil">
            <i class="fas fa-user icon-usuario"></i>
            <i class="fas fa-pen icon-editar-foto"></i>
        </div>

        <form>
            <div class="grupo">
                <label>nombres y apellidos</label>
                <div class="input-box">
                    <input type="text" value="Dann Martinez">
                    <i class="fas fa-pen"></i>
                </div>
            </div>

            <div class="grupo">
                <label>E-mail</label>
                <input type="email" value="usuario@gmail.com">
            </div>

            <div class="grupo">
                <label>Id</label>
                <input type="text" value="1234567890">
            </div>

            <div class="grupo">
                <label>teléfono</label>
                <div class="input-box">
                    <input type="text" value="3003215468">
                    <i class="fas fa-pen"></i>
                </div>
            </div>

            <div class="grupo">
                <label>dirección</label>
                <div class="input-box">
                    <input type="text" value="Maria Occidente">
                    <i class="fas fa-pen"></i>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
