<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="agregarproducto.css">
</head>
<body>

<div class="container">

    <!-- Buscador -->
    <div class="search">
        <input type="text" placeholder="Search">
    </div>

    <!-- Encabezado -->
    <div class="table header">
        <span>Imagen</span>
        <span>categoria</span>
        <span>Productos</span>
        <span>Cantidad</span>
        <span>Estado</span>
        <span>Opciones</span>
    </div>

    <!-- Fila -->
    <div class="table row">
        <div class="img-box"></div>
        <div class="avatar"></div>
        <span>Lacteos</span>
        <span>Espinoza</span>
        <span>supervisor</span>
        <div class="switch active"></div>
        <div class="actions">
            <span class="icon folder"></span>
            <span class="icon trash"></span>
            <span class="icon edit"></span>
            <span class="icon view"></span>
        </div>
    </div>

    <div class="table row">
        <div class="img-box"></div>
        <div class="avatar"></div>
        <span>Granos</span>
        <span>Pipicano</span>
        <span>manipulador</span>
        <div class="switch active"></div>
        <div class="actions">
            <span class="icon folder"></span>
            <span class="icon trash"></span>
            <span class="icon edit"></span>
            <span class="icon view"></span>
        </div>
    </div>

    <div class="table row">
        <div class="img-box"></div>
        <div class="avatar"></div>
        <span>Verduras</span>
        <span>Ortega</span>
        <span>supervisor</span>
        <div class="switch inactive"></div>
        <div class="actions">
            <span class="icon folder"></span>
            <span class="icon trash"></span>
            <span class="icon edit"></span>
            <span class="icon view"></span>
        </div>
    </div>

    <div class="table row">
        <div class="img-box"></div>
        <div class="avatar"></div>
        <span>Frutas</span>
        <span>Rivera</span>
        <span>manipulador</span>
        <div class="switch inactive"></div>
        <div class="actions">
            <span class="icon folder"></span>
            <span class="icon trash"></span>
            <span class="icon edit"></span>
            <span class="icon view"></span>
        </div>
    </div>

    <div class="table row">
        <div class="img-box"></div>
        <div class="avatar"></div>
        <span>Isabela</span>
        <span>Campo</span>
        <span>manipulador</span>
        <div class="switch active"></div>
        <div class="actions">
            <span class="icon folder"></span>
            <span class="icon trash"></span>
            <span class="icon edit"></span>
            <span class="icon view"></span>
        </div>
    </div>

    <!-- Botón -->
    <button class="add-btn">agregar productos</button>

</div>

</body>
</html>
